{{/* Editor-style site header. Theme toggle + mobile menu are wired in baseof.html. */}}
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Who Owns the Code, home">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="1.5"/>
        <path d="M12 10 L7 16 L12 22" stroke="var(--tok-var)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 10 L25 16 L20 22" stroke="var(--tok-string)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17.5 8 L14.5 24" stroke="var(--tok-op)" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span>whoownsthecode<span class="paren">()</span></span>
    </a>

    <nav class="nav" id="nav" aria-label="Primary">
      {{- range .Site.Params.navbar }}
      <a href="{{ .url }}"{{ if eq $.RelPermalink .url }} aria-current="page"{{ end }}>{{ .title }}</a>
      {{- end }}
    </nav>

    <div class="header-tools">
      <button class="toggle" id="themeToggle" type="button" aria-label="Toggle color theme">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="lbl-light">theme: light</span>
        <span class="lbl-dark">theme: dark</span>
      </button>
    </div>

    <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>
