<link rel="icon" type="image/png" href="{{ "images/favicon.png" | relURL }}" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=fallback" rel="stylesheet">

{{/* Content-hash cache-buster: forces browsers (esp. phones that cache CSS
     aggressively) to refetch custom.css whenever its contents change. */}}
{{ $cssver := readFile "static/css/custom.css" | crypto.MD5 }}
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}?v={{ $cssver }}">
