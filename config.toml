baseURL = 'https://whoownsthecode.com'
languageCode = 'en-us'
title = 'Who Owns the Code'

# Match the Accentient site: load Inter (feeds the Google Fonts link in layouts/partials/css.html)
[params.font]
name = "Inter"
sizes = [400, 500, 600, 700, 800]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params.hero]
enabled = true
title = "Who Owns the Code?"
subtitle = "AI code == No author == No copyright"

# Scrolling strip of AI coding tools on the homepage (layouts/partials/home/ai-tools.html)
[params.aitools]
enabled = true
eyebrow = "Our guidance applies to code generated from every AI tool"

# Enable footer
[params.footer]
enabled = true
content = "© 2026 Who Owns The Code, Inc. All rights reserved."

# Add navbar links

[params.navbarlogo]
image = "logo48x48.png"
link = "/"
width = 48  
height = 48

[[params.navbar]]
title = "Resources"
url = "/resources/"

[[params.navbar]]
title = "Authors"
url = "/authors/"

[[params.navbar]]
title = "Presentations"
url = "/presentations/"

[[params.navbar]]
